; 機体ごとにビルドを分けてある。焼く前に platformio.ini を書き換える運用は
; 「押入れ用のファームを百葉箱に焼く」事故を1コマンドで起こせるので廃止した。
;
; | env      | センサ  | 機体                    | 7セグ | id (MAC)          | IP            | port        |
; | -------- | ------- | ----------------------- | ----- | ----------------- | ------------- | ----------- |
; | closet   | AM2320  | 押入れサーバ室 吸気     | なし  | 10:00:3B:CC:E8:48 | 192.168.1.195 | /dev/ttyACM0 |
; | closet   | AM2320  | 押入れサーバ室 排気     | なし  | 10:00:3B:CC:A9:4C | 192.168.1.112 | /dev/ttyACM9 |
; | indoor   | BME280  | 百葉箱                  | あり  | 08:92:72:91:5D:9C | 192.168.1.156 | /dev/ttyACM5 |
;
; ★ /dev/ttyACM* の番号は挿し直しで動く。焼くときは必ず MAC で名指しすること:
;     pio run -e indoor -t upload \
;       --upload-port /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_08:92:72:91:5D:9C-if00
;
; ★ 7セグが載っているのは百葉箱だけ。押入れの2台は誰も見ないので積んでいない。
;   ∴ USE_DISPLAY は env 側で機体ごとに決める。ここに書くな。
;
; ★ USE_DISPLAY=0 を焼いた機体は健全に見える。sensor_ok=1・read_errors=0・HTTP も
;   Prometheus も正常で、表示器が叩かれているかを見るメトリクスは存在しない。
;   しかも TM1637 は自前のレジスタに最後の値を保持し、リフラッシュでは電源が
;   落ちない。∴ 症状は「もっともらしい数字が固まる」で、真っ暗にはならない。
;   2026-09-30、USE_DISPLAY=0 を [common] へ上げた時に百葉箱がこれで7日間固まった。

[platformio]
; 既定は押入れの2台。百葉箱を焼くときは -e indoor を明示する。
default_envs = closet

[common]
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
;   USE_DISPLAY はここに置かないこと。機体ごとに違う（closet=0 / indoor=1）ので、
;   ここに置くと両方に効いて百葉箱の表示器が黙って死ぬ。

[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit BME280 Library@^2.3.0
    adafruit/Adafruit Unified Sensor@^1.1.15
    robtillaart/AM232X@^0.5.3
    smougenot/TM1637

[env:closet]
build_flags =
    ${common.build_flags}
    -D SENSOR_TYPE=SENSOR_AM2320
;   押入れの2台は表示器を積んでいないので TM1637 を一切叩かない。CLK(GPIO5)/DIO(GPIO2)
;   が静かになり、発熱も減る。食塩水テストでは自己発熱そのものが測る対象なので効く。
    -D USE_DISPLAY=0

[env:indoor]
build_flags =
    ${common.build_flags}
    -D SENSOR_TYPE=SENSOR_BME280
;   百葉箱は7セグを積んでいる。ここを 0 にすると表示器が固まる（上の★を参照）。
    -D USE_DISPLAY=1
